  <path class="edge" d="M100 367V405H430V445"/><path class="edge" d="M300 367V405H480V445"/><path class="edge" d="M700 367V405H540V445"/>
  <g><rect class="core" x="425" y="35" width="150" height="53" rx="10"/><text class="name" x="500" y="58">cli.py</text><text class="sub" x="500" y="77">入口：组装部件</text></g>
  <g><rect class="node" x="75" y="158" width="140" height="47" rx="9"/><text class="name" x="145" y="187">config.py</text></g>
