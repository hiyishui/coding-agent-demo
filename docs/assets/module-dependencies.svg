    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.edge{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}
      .node{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.core{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.data{fill:#fef3c7;stroke:#d97706;stroke-width:1.7}
      .name{font-size:15px;font-weight:650;fill:#0f172a;text-anchor:middle}.sub{font-size:12px;fill:#475569;text-anchor:middle}.label{font-size:12px;fill:#475569}
    </style>
  </defs>
  <rect width="1000" height="510" rx="14" fill="#fff"/>
