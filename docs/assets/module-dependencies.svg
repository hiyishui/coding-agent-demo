<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
  <title id="title">minicode 模块依赖关系</title>
  <desc id="desc">cli 组装并驱动 Agent。Agent 依赖 events、providers、permissions、tools 和 context；相关模块使用 messages 中的数据类型。</desc>
