<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1400" role="img" aria-labelledby="title desc">
  <title id="title">一次用户输入的完整业务流程</title>
  <desc id="desc">用户输入后先记录，再从日志重建对话；检查预算和上下文大小后调用 LLM 并记录回复。模型不调用工具就把回答返回给用户；否则逐个处理工具调用：权限决策、记录审批、执行或生成拒绝说明、记录工具结果。全部处理完后，若没有连续失败就回到重建对话这一步，带着新的工具结果再次调用 LLM。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.edge{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}.back{stroke-dasharray:6 4}
      .action{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.decision{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.7}.allow{fill:#dcfce7;stroke:#16a34a;stroke-width:1.7}.deny{fill:#fee2e2;stroke:#dc2626;stroke-width:1.7}
      .record{fill:#fef3c7;stroke:#d97706;stroke-width:1.7}.llm{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.exec{fill:#ede9fe;stroke:#7c3aed;stroke-width:1.7}
      .box{fill:#fafafa;stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:7 5}
      .label{font-size:14px;font-weight:650;fill:#0f172a;text-anchor:middle}.sub{font-size:12px;fill:#475569;text-anchor:middle}.branch{font-size:13px;fill:#475569}.title{font-size:14px;font-weight:650;fill:#334155}.legend{font-size:13px;fill:#334155}
    </style>
  </defs>
  <rect width="1020" height="1400" rx="14" fill="#fff"/>

  <!-- 工具调用循环的虚线框 -->
  <rect class="box" x="515" y="640" width="485" height="535" rx="14"/>
  <text class="title" x="535" y="662">⑨ 逐个处理本次的工具调用</text>

  <!-- 主线 -->
  <path class="edge" d="M360 72V104"/>
  <path class="edge" d="M360 152V184"/>
  <path class="edge" d="M360 246V264"/>
  <path class="edge" d="M265 308H217"/><text class="branch" x="232" y="300">是</text>
  <path class="edge" d="M360 350V374"/><text class="branch" x="368" y="367">否</text>
  <path class="edge" d="M455 418H528"/><text class="branch" x="482" y="410">是</text>
  <path class="edge back" d="M630 394V216H492"/><text class="branch" x="640" y="300">压缩后重新开始</text>
  <path class="edge" d="M360 460V484"/><text class="branch" x="368" y="477">否</text>
  <path class="edge" d="M360 546V570"/>
  <path class="edge" d="M360 632V654"/>
  <path class="edge" d="M265 698H217"/><text class="branch" x="222" y="690">不要</text>
  <path class="edge" d="M455 698H618"/><text class="branch" x="480" y="690">要</text>

  <!-- 工具调用循环 -->
  <path class="edge" d="M760 726V748"/>
  <path class="edge" d="M760 796V816"/>
  <path class="edge" d="M680 860H645V928"/><text class="branch" x="652" y="852">是</text>
  <path class="edge" d="M840 860H865V928"/><text class="branch" x="848" y="852">否</text>
  <path class="edge" d="M645 984V1012"/>
  <path class="edge" d="M865 984V1012"/>
  <path class="edge" d="M760 1060V1080"/>
  <path class="edge back" d="M840 1122H978V699H902"/><text class="branch" x="850" y="1114">有</text>
  <path class="edge" d="M760 1162V1196"/><text class="branch" x="768" y="1188">没有</text>

  <!-- 收尾 -->
  <path class="edge" d="M760 1282V1308"/><text class="branch" x="768" y="1300">是</text>
  <path class="edge back" d="M665 1240H20V216H228"/>
  <text class="branch" x="40" y="1230">否：回到 ②，带着新的工具结果再次调用 LLM</text>

  <!-- 节点：主线 -->
  <g><rect class="allow" x="250" y="26" width="220" height="46" rx="23"/><text class="label" x="360" y="55">用户输入一条任务</text></g>
  <g><rect class="record" x="230" y="106" width="260" height="46" rx="10"/><text class="label" x="360" y="135">① 记录 user_message</text></g>
  <g><rect class="action" x="230" y="186" width="260" height="60" rx="10"/><text class="label" x="360" y="211">② 从日志重建对话</text><text class="sub" x="360" y="232">reduce(events)，得到要发给模型的消息</text></g>
  <g><polygon class="decision" points="360,266 455,308 360,350 265,308"/><text class="label" x="360" y="313">③ 超出预算？</text></g>
  <g><rect class="deny" x="35" y="284" width="180" height="48" rx="10"/><text class="label" x="125" y="304">记录 paused</text><text class="sub" x="125" y="323">暂停，告诉用户原因</text></g>
  <g><polygon class="decision" points="360,376 455,418 360,460 265,418"/><text class="label" x="360" y="423">④ 上下文超过 75%？</text></g>
  <g><rect class="record" x="530" y="394" width="200" height="48" rx="10"/><text class="label" x="630" y="414">压缩旧对话</text><text class="sub" x="630" y="433">记录 compaction</text></g>
  <g><rect class="llm" x="230" y="486" width="260" height="60" rx="10"/><text class="label" x="360" y="511">⑤ 调用 LLM</text><text class="sub" x="360" y="532">系统提示词 + 完整对话 + 工具清单</text></g>
  <g><rect class="record" x="230" y="572" width="260" height="60" rx="10"/><text class="label" x="360" y="597">⑥ 记录 assistant_message</text><text class="sub" x="360" y="618">模型的文字和它要调用的工具</text></g>
  <g><polygon class="decision" points="360,656 455,698 360,740 265,698"/><text class="label" x="360" y="703">⑦ 要调用工具？</text></g>
  <g><rect class="allow" x="35" y="674" width="180" height="48" rx="24"/><text class="label" x="125" y="694">⑧ 回答返回给用户</text><text class="sub" x="125" y="713">本轮结束</text></g>

  <!-- 节点：工具调用循环 -->
  <g><rect class="action" x="620" y="672" width="280" height="54" rx="10"/><text class="label" x="760" y="694">权限决策</text><text class="sub" x="760" y="714">策略判断；需要时问用户（无头模式拒绝）</text></g>
  <g><rect class="record" x="620" y="750" width="280" height="46" rx="10"/><text class="label" x="760" y="778">记录 approval</text></g>
  <g><polygon class="decision" points="760,818 840,860 760,902 680,860"/><text class="label" x="760" y="865">允许？</text></g>
  <g><rect class="exec" x="545" y="930" width="200" height="54" rx="10"/><text class="label" x="645" y="952">执行工具</text><text class="sub" x="645" y="972">ToolRegistry.run</text></g>
  <g><rect class="action" x="775" y="930" width="180" height="54" rx="10"/><text class="label" x="865" y="952">生成拒绝说明</text><text class="sub" x="865" y="972">作为 is_error 结果</text></g>
  <g><rect class="record" x="620" y="1014" width="280" height="46" rx="10"/><text class="label" x="760" y="1042">记录 tool_result</text></g>
  <g><polygon class="decision" points="760,1082 840,1122 760,1162 680,1122"/><text class="label" x="760" y="1127">还有下一个？</text></g>

  <!-- 节点：收尾 -->
  <g><polygon class="decision" points="760,1198 855,1240 760,1282 665,1240"/><text class="label" x="760" y="1245">⑩ 连续 3 次失败？</text></g>
  <g><rect class="deny" x="650" y="1310" width="220" height="48" rx="10"/><text class="label" x="760" y="1330">记录 paused</text><text class="sub" x="760" y="1349">暂停，请用户介入</text></g>

  <!-- 图例 -->
  <g>
    <rect class="record" x="40" y="1300" width="22" height="16" rx="4"/><text class="legend" x="70" y="1313">写入事件日志</text>
    <rect class="llm" x="190" y="1300" width="22" height="16" rx="4"/><text class="legend" x="220" y="1313">调用 LLM</text>
    <rect class="exec" x="320" y="1300" width="22" height="16" rx="4"/><text class="legend" x="350" y="1313">执行工具</text>
    <rect class="decision" x="460" y="1300" width="22" height="16" rx="4"/><text class="legend" x="490" y="1313">判断</text>
    <rect class="allow" x="40" y="1334" width="22" height="16" rx="8"/><text class="legend" x="70" y="1347">开始 / 结束</text>
    <rect class="deny" x="190" y="1334" width="22" height="16" rx="4"/><text class="legend" x="220" y="1347">暂停</text>
    <path class="edge back" d="M320 1342H350"/><text class="legend" x="360" y="1347">回到前面的步骤</text>
  </g>
</svg>
